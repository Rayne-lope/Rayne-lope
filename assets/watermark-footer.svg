<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="14" fill="url(#cardBg)"/>
  <rect width="1200" height="240" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- Giant Ghosted Typographic Watermark (Matching Reference 2 'Accelerate' Style) -->
  <text x="40" y="150" fill="url(#wmGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif" font-size="140" font-weight="900" letter-spacing="-3">ACCELERATE</text>

  <!-- Top Divider / Baseline -->
  <line x1="40" y1="160" x2="1160" y2="160" stroke="#30363d" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- Lower Navigation & Metadata Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace" font-size="13">
    <!-- Quick Nav -->
    <text x="40" y="195" fill="#8b949e" font-weight="600">
      <tspan fill="#58a6ff">NAV://</tspan>
      <tspan fill="#c9d1d9">  Services  •  Showcase  •  Experience  •  Stacks  •  Contact</tspan>
    </text>

    <!-- Status & Specs Right -->
    <text x="1160" y="195" text-anchor="end" fill="#8b949e" font-family="'Courier New', monospace">
      <tspan fill="#3fb950">● ONLINE</tspan>  |  <tspan fill="#f0f6fc">NODE_RAYNE_LOPE</tspan>  |  <tspan fill="#8b949e">YOGYAKARTA.ID</tspan>
    </text>

    <!-- Bottom Copyright & Philosophy Note -->
    <text x="40" y="222" fill="#484f58" font-size="11" font-family="'Courier New', monospace">
      © 2026 MOHAMMAD RAFY RAHMAWAN // ALL RIGHTS RESERVED // BUILT WITH INTENT &amp; PRECISION
    </text>
    <text x="1160" y="222" text-anchor="end" fill="#58a6ff" font-size="11" font-family="'Courier New', monospace">
      [ END_OF_FILE // TRANSMISSION_TERMINATED ]
    </text>
  </g>
</svg>
